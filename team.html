<script>
(()=>{
// ---------- data ----------
const CHARS={ // atk, def, spd, charm (design doc, 13 Nov)
  hero:{name:'ฮิบิกิ',cls:'สมดุล',st:[6,6,6,6]},heroine:{name:'เซเรน่า',cls:'สมดุล',st:[6,6,6,6]},
  fire:{name:'เบลซ',cls:'สายตี',st:[10,5,6,4]},ice:{name:'โนเอล',cls:'สายกัน',st:[4,10,5,7]},katana:{name:'มิคัง',cls:'สายสปีด',st:[7,4,10,5]}};
const SONG_URL='songs/'+((new URLSearchParams(location.search).get('song')||'wake').replace(/[^a-z0-9_-]/gi,'')||'wake')+'.json';
const SET_BEATS=8,CHECK_BEAT=6.6,LEAD=8;   // row = 8 beats (2 bars), check near the end of the 2nd bar
const C={zp:100,ga:3,ac:600,dc:600,w:.06,full:120};
const JW=[[.045,'PERFECT',1,'#ffd84f'],[.09,'GREAT',.8,'#7dffb0'],[.14,'GOOD',.6,'#7cc8ff'],[.2,'BAD',.3,'#c9a0ff']];
const $=id=>document.getElementById(id);
const mult=v=>1+(v-6)*C.w;
let SONG=null,BPM=144,FIRST=0,SPB=60/144,GUARD_ROWS=3,GUARD_K=1;
let ac=null,buf=null,src=null,t0=0,running=false,off=0,setIdx=-1,cur=null,anim=null,queue=[];
let pick={me:'hero',op:'katana'},FR={};
const P={me:{zp:0,g:0,inc:null,st:null},op:{zp:0,g:0,inc:null,st:null}};
const esc2=t=>String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const other=w=>w==='me'?'op':'me';
try{off=+localStorage.getItem('mf_off')||0;const p=JSON.parse(localStorage.getItem('mf_pick')||'null');if(p&&CHARS[p.me]&&CHARS[p.op])pick=p}catch(e){}
$('offV').textContent=off+' ms';
$('offM').onclick=()=>setOff(off-10);$('offP').onclick=()=>setOff(off+10);
function setOff(v){off=v;$('offV').textContent=off+' ms';try{localStorage.setItem('mf_off',off)}catch(e){}}
const now=()=>ac?(ac.currentTime-t0)*RATE-off/1000:0; // song time (the song may be sped up in ranked)
const beatT=b=>FIRST+LEAD*SPB+b*SPB;
function setSong(s){SONG=s;if(+QP.get('bpm'))RATE=Math.max(.7,Math.min(1.4,+QP.get('bpm')/s.bpm));BPM=s.bpm;FIRST=s.first||0;SPB=60/BPM;
  // guard window ≈ 10 s rounded to whole rows (min 2); guard per row scaled by 3/rows so every song is equally guardable
  GUARD_ROWS=Math.max(2,Math.round(10*RATE/(SET_BEATS*SPB)));GUARD_K=3/GUARD_ROWS}
// ---------- sound effects (synthesized, no files) ----------
let sfxOn=true;try{sfxOn=localStorage.getItem('mf_sfx')!=='0'}catch(e){}
const sfxB=$('sfxB');function sfxLabel(){sfxB.textContent=sfxOn?'เปิด':'ปิด';sfxB.setAttribute('aria-pressed',sfxOn)}sfxLabel();
sfxB.onclick=()=>{sfxOn=!sfxOn;sfxLabel();try{localStorage.setItem('mf_sfx',sfxOn?'1':'0')}catch(e){}};
let sfxBus=null,noiseBuf=null,musicBus=null;
// volumes: music lower than effects by default so hits and judgements are heard over the song
const VOL={m:40,s:90};try{const v=JSON.parse(localStorage.getItem('mf_vol')||'null');if(v)Object.assign(VOL,v)}catch(e){}
for(const [id,k] of [['volM','m'],['volS','s']]){const el=$(id);el.value=VOL[k];el.oninput=()=>{VOL[k]=+el.value;if(k==='m'&&musicBus)musicBus.gain.value=VOL.m/100;if(k==='s'&&sfxBus)sfxBus.gain.value=VOL.s/100;
  try{localStorage.setItem('mf_vol',JSON.stringify(VOL))}catch(e){}}}
function sfxInit(){if(sfxBus)return;sfxBus=ac.createGain();sfxBus.gain.value=VOL.s/100;const lim=ac.createDynamicsCompressor();lim.threshold.value=-10;lim.ratio.value=12;lim.attack.value=.002;lim.release.value=.15;sfxBus.connect(lim);lim.connect(ac.destination);
  noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
function tone(f,dur,{type='sine',vol=.3,at=0,f2=null,att=.004}={}){const t=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0005,t+dur);
  o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+dur+.02)}
function noise(dur,{vol=.3,at=0,lp=3000,lp2=null,hp=0}={}){const t=ac.currentTime+at,s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noiseBuf;
  f.type='lowpass';f.frequency.setValueAtTime(lp,t);if(lp2)f.frequency.exponentialRampToValueAtTime(lp2,t+dur);let n=f;
  if(hp){const h=ac.createBiquadFilter();h.type='highpass';h.frequency.value=hp;f.connect(h);n=h}
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);s.connect(f);n.connect(g);g.connect(sfxBus);s.start(t);s.stop(t+dur+.02)}

// band-passed noise sweep: whooshes, blade swishes, flame roars
function band(dur,{vol=.3,at=0,f=1200,f2=null,q=2}={}){const t=ac.currentTime+at,s=ac.createBufferSource(),b=ac.createBiquadFilter(),g=ac.createGain();s.buffer=noiseBuf;s.loop=true;
  b.type='bandpass';b.Q.value=q;b.frequency.setValueAtTime(f,t);if(f2)b.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.04,dur*.3));g.gain.exponentialRampToValueAtTime(.0005,t+dur);s.connect(b);b.connect(g);g.connect(sfxBus);s.start(t);s.stop(t+dur+.02)}
const thud=(v=1,at=0)=>{tone(150,.22,{vol:.4*v,f2:45,at});noise(.12,{vol:.3*v,lp:1400,at})};
const bigBoom=(v=1)=>{noise(1.1,{vol:.55*v,lp:2200,lp2:90});tone(90,.9,{vol:.45*v,f2:30});tone(55,1.2,{vol:.3*v,f2:28,at:.03})};
const ring=(fs,dur,vol,at=0)=>fs.forEach((f,i)=>tone(f,dur,{vol,at:at+i*.01}));
// per-character kits, keyed by the beats the attack engines report: start · move · hit(power) · slash · zap · cast · fx · boom
const KIT={
  hero:{start:()=>{tone(110,1.1,{type:'sawtooth',vol:.09,f2:520,att:.3});band(1.1,{vol:.12,f:300,f2:2500})},move:()=>band(.16,{vol:.16,f:700,f2:2200}),
    hit:p=>thud(Math.min(1.4,.5+p/16)),zap:()=>{noise(.09,{vol:.16,lp:9000,hp:2500});tone(rnd(900,1600),.06,{type:'square',vol:.05})},fx:()=>band(.3,{vol:.07,f:1800,f2:600}),boom:()=>bigBoom(1)},
  heroine:{start:()=>[784,988,1175,1568].forEach((f,i)=>tone(f,.5,{vol:.1,at:i*.07,type:'triangle'})),move:()=>band(.14,{vol:.12,f:1500,f2:3500}),
    cast:()=>{band(.35,{vol:.14,f:2500,f2:900,q:4});tone(rnd(1400,2000),.25,{vol:.06})},hit:p=>{tone(520,.3,{type:'triangle',vol:.18,f2:180});noise(.15,{vol:.18,lp:3000})},
    fx:()=>tone(rnd(1800,2600),.3,{vol:.05}),boom:()=>{bigBoom(.8);[262,330,392].forEach(f=>tone(f,1.2,{vol:.09,type:'triangle'}))}},
  katana:{start:()=>{band(.5,{vol:.2,f:2000,f2:8000,q:6});ring([2490,3730,5100],.9,.05,.35);tone(55,1.4,{vol:.18,f2:40,att:.4})},move:()=>band(.12,{vol:.2,f:1200,f2:4000}),
    slash:()=>{band(.13,{vol:.3,f:6000,f2:1500,q:3});ring([3100,4600],.25,.04,.02)},hit:p=>{band(.1,{vol:.3,f:4500,f2:1200,q:2});tone(160,.18,{vol:.2*Math.min(1.3,.5+p/16),f2:60})},
    fx:()=>{tone(48,.6,{vol:.14,f2:38,att:.15});band(.5,{vol:.06,f:300,f2:160})},boom:()=>{bigBoom(1);band(.8,{vol:.15,f:400,f2:80})}},
  ice:{start:()=>{[1568,2093,2637,3136].forEach((f,i)=>tone(f*(1+rnd(-.004,.004)),1,{vol:.06,at:i*.09}));band(1,{vol:.06,f:6000,f2:2500,q:5})},move:()=>band(.14,{vol:.12,f:2500,f2:6000}),
    slash:()=>{band(.12,{vol:.22,f:7000,f2:2500,q:3});tone(3500,.2,{vol:.05})},hit:p=>{for(let i=0;i<4;i++)noise(.03,{vol:.2,lp:12000,hp:3000,at:i*.025});tone(2800,.4,{vol:.06});tone(140,.2,{vol:.18,f2:60})},
    fx:()=>tone(rnd(2600,4200),.35,{vol:.04}),boom:()=>{bigBoom(.75);for(let i=0;i<10;i++){noise(.04,{vol:.16,lp:14000,hp:4000,at:i*.035});tone(rnd(2500,5000),.3,{vol:.035,at:i*.035})}}},
  fire:{start:()=>{band(.9,{vol:.2,f:200,f2:1400,q:1});tone(80,.9,{vol:.12,f2:140})},move:()=>band(.15,{vol:.16,f:600,f2:1600}),
    hit:p=>{thud(Math.min(1.5,.6+p/14));band(.25,{vol:.12,f:900,f2:300,q:1})},fx:()=>{band(.6,{vol:.24,f:500,f2:1200,q:.8});noise(.6,{vol:.1,lp:400})},
    zap:()=>band(.1,{vol:.1,f:2000,q:2}),slash:()=>band(.14,{vol:.2,f:1000,f2:3000}),boom:()=>{bigBoom(1.2);band(1.2,{vol:.2,f:700,f2:120,q:.7})}}};
const rnd=(a,b)=>a+Math.random()*(b-a);
// recorded sounds (sfx/<file>.mp3) replace the synth kit beat by beat; null = silent for that beat. Missing beats fall back to the synth.
const SAMPLES={katana:{start:[['katana_start',1],['katana_aura',.55]],move:[['katana_move',.8]],slash:[['katana_slash',.9]],hit:[['katana_hit',.8]],end:[['katana_sheath',.9]],fx:null}};
const SBUF={},SLAST={};
async function loadSamples(ids){if(!ac)return;const want=new Set();for(const id of ids){for(const v of Object.values(SAMPLES[id]||{}))for(const [f] of v||[])want.add(f);for(const c of (CUE[id]&&CUE[id].c)||[])want.add(c.f)}
  await Promise.all([...want].filter(f=>!SBUF[f]).map(async f=>{try{SBUF[f]=await ac.decodeAudioData(await (await fetch('sfx/'+f+'.mp3')).arrayBuffer())}catch(e){}}))}
function playBuf(b,vol){const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;s.playbackRate.value=rnd(.95,1.06);g.gain.value=vol;s.connect(g);g.connect(sfxBus);s.start()}
// hand-timed cues from sfx-editor.html (same origin → same localStorage): played from the 'start' beat, replacing beat-driven sounds
// defaults from sfx/cues.json (timed in the editor); this device's own edits in localStorage win per character
let CUE={};const loadCues=async()=>{let def={},loc={};try{def=await (await fetch('sfx/cues.json')).json()}catch(e){}
  try{loc=JSON.parse(localStorage.getItem('mf_cues')||'{}')||{}}catch(e){}CUE=Object.assign({},def);for(const k in loc)if(loc[k]&&loc[k].c&&loc[k].c.length)CUE[k]=loc[k]};
const CDEFV={katana_aura:.55,katana_move:.8,katana_hit:.8};
function charSfx(cid,k,p){if(!sfxOn||!ac)return;sfxInit();const Q=CUE[cid];
  if(Q&&Q.c&&Q.c.length){if(k==='start'){const t0=ac.currentTime;for(const c of Q.c){const b=SBUF[c.f];if(!b)continue;const s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;g.gain.value=(Q.v||{})[c.f]??CDEFV[c.f]??.9;s.connect(g);g.connect(sfxBus);s.start(t0+c.t)}}
    if(k!=='boom')return;const f=(KIT[cid]||{}).boom;if(f)f(p);return}
  const S=SAMPLES[cid];
  if(S&&k in S){if(!S[k])return;const t=performance.now();if(SLAST[cid+k]&&t-SLAST[cid+k]<90)return;SLAST[cid+k]=t;
    for(const [f,v] of S[k])if(SBUF[f])playBuf(SBUF[f],v);return}

function netPlayers(ps){const gone=ids().filter(i=>!ps[i]);let changed=false;
  for(const id of gone){const p=PL[id],mid=running||NETR.fin===1;delete PL[id];changed=true;

  for(const id in ps){const r=ps[id];if(!r||typeof r!=='object')continue;const isNew=upsert(id,r);if(isNew){changed=true;if(id!==ME&&!r.bot&&ROOM.phase!=='load')chatLine('ระบบ',PL[id].name+' เข้าห้อง')}}
  if(PL[ME])MYTEAM=PL[ME].team;

function netEv(e){if(!running)return;const id=e.u;if(!PL[id])return;
  if(e.t==='row'){if(local(id))return;const n=JN(+e.m||0);showJudge(id,n,null,e.k);otherSfx(n)}
  else if(e.t==='atk'){const si=+e.si,tg=e.tgt;if(!PL[tg])return;const late=now()>beatT(si*SET_BEATS+CHECK_BEAT)+.9;
    if(!late)clashAdd(id,tg,+e.dmg||0,+e.lvl||1,si,+e.m||0);else launch(id,tg,+e.dmg||0,+e.lvl||1,si)}
  else if(e.t==='res'){const a=ATK[e.k];if(!a||a.res)return;const T=PL[e.u];if(T){const i=T.inc.indexOf(a.inc);if(i>=0)T.inc.splice(i,1);if(e.ok&&T.stats)T.stats.guard++}
    const A=PL[a.who];if(A&&A.stats){A.stats.atk++;if(!e.ok)A.stats.hit++}a.res={ok:!!e.ok,lost:Math.max(0,+e.lost||0)};deliver(a)}
  else if(e.t==='strike'){const tg=e.tgt;if(!PL[tg])return;strike(id,tg,Math.max(0,+e.d||0))}}
